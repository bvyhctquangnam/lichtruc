<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch trực Bệnh viện YHCT Quảng Nam</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #fff;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        #mainFrame {
            display: block;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            border: none;
        }

        /* Loading overlay */
        #loading {
            position: fixed;
            inset: 0;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: opacity 0.35s ease;
        }
        #loading.hide {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid #e0e7ff;
            border-top-color: #00008B;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text {
            margin-top: 18px;
            color: #1e293b;
            font-weight: 500;
            font-size: 14px;
        }

        /* Error state */
        .error-msg {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            color: #b91c1c;
            text-align: center;
            padding: 0 24px;
            max-width: 420px;
        }
        #loading.error .spinner,
        #loading.error .loading-text { display: none; }
        #loading.error .error-msg { display: flex; }
        .error-msg p { line-height: 1.55; font-size: 14px; }
        .retry-btn {
            padding: 10px 28px;
            background: #00008B;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .retry-btn:hover { background: #00006a; }
        .retry-btn:active { transform: scale(0.97); }
    </style>
</head>
<body>

<iframe id="mainFrame"
        src="https://script.google.com/macros/s/AKfycbwKZsQPyJlpEn0g6cK53kAs5WX-DyDrU3-_RvrOyYs/exec"
        allow="clipboard-write"
        referrerpolicy="no-referrer-when-downgrade"></iframe>

<div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Đang tải lịch trực...</div>
    <div class="error-msg">
        <p>⚠️ Không tải được nội dung.<br>Vui lòng kiểm tra kết nối mạng hoặc thử lại.</p>
        <button class="retry-btn" onclick="retry()">Thử lại</button>
    </div>
</div>

<script>
(function() {
    const frame = document.getElementById('mainFrame');
    const loading = document.getElementById('loading');
    const TIMEOUT_MS = 20000;
    let timeoutId = null;
    let loaded = false;

    function hideLoading() {
        if (loaded) return;
        loaded = true;
        clearTimeout(timeoutId);
        loading.classList.add('hide');
    }

    function showError() {
        if (loaded) return;
        loading.classList.add('error');
    }

    function startTimeout() {
        clearTimeout(timeoutId);
        timeoutId = setTimeout(showError, TIMEOUT_MS);
    }

    // iframe cross-origin: load fire khi document cuối cùng render xong
    frame.addEventListener('load', hideLoading);

    window.retry = function() {
        loaded = false;
        loading.classList.remove('hide', 'error');
        startTimeout();
        // Force reload: xoá src rồi set lại
        const src = frame.src;
        frame.src = 'about:blank';
        setTimeout(function() { frame.src = src; }, 200);
    };

    startTimeout();
})();
</script>
</body>
</html>
